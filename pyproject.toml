[project]
name = "norvence-factum-mini"
version = "0.1.0"
description = "Extraction des champs de factures fournisseurs par LLM et normalisation avant export comptable."
requires-python = ">=3.11,<3.13"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "pytest-cov>=7.1.0",
    "ruff>=0.6,<0.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
# Total combiné app : 83/92 = 90,22 % ; sans tests du normaliseur : 72,83 %.
# 89 % garde une marge de maintenance tout en bloquant cette perte de tests.
fail_under = 89

[tool.ruff]
line-length = 100
target-version = "py311"
